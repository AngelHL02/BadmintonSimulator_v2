<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badminton Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains+Mono', monospace;
    }
    /* Custom scrollbar for sidebar */
    aside::-webkit-scrollbar {
      width: 6px;
    }
    aside::-webkit-scrollbar-track {
      background: #060910;
    }
    aside::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    aside::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 h-screen w-screen overflow-hidden flex flex-col md:flex-row">

  <!-- Sidebar Control Panel -->
  <aside class="w-full md:w-80 lg:w-96 bg-[#090d16] border-r border-slate-800/80 flex flex-col justify-between shrink-0 h-auto md:h-full z-20 shadow-2xl overflow-y-auto">
    
    <!-- Sidebar Header -->

        <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 shadow-inner">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
          <h1 class="font-bold text-base text-white tracking-wide leading-none">Badminton Simulator</h1>
          <p class="text-xs text-slate-400 mt-1">Court Judge & Trajectory Physics</p>
        </div>
      </div>
      <button id="toggle-sound-btn" class="p-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 transition-colors border border-slate-800" title="Toggle SFX">
        <svg id="sound-icon-on" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        <svg id="sound-icon-off" class="w-4 h-4 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
      </button>
    </div>

    <!-- Sidebar Body Content -->
    <div class="p-4 space-y-5 flex-1">

      <!-- LINE JUDGE CALL DISPLAY & TALLY COUNTER -->
      <div class="bg-[#05080f] rounded-xl p-3.5 border border-slate-800/80 shadow-inner space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg> Line Judge Call
          </span>
          <span id="mode-badge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-900 text-slate-300 border border-slate-800">
            DOUBLES
          </span>
        </div>

        <div class="flex items-center justify-between pt-0.5">
          <div id="call-badge" class="px-4 py-1.5 rounded-lg text-lg font-black tracking-wider shadow-lg flex items-center gap-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/50">
            <span id="call-ping" class="w-2.5 h-2.5 rounded-full animate-ping bg-emerald-400"></span>

        <p id="call-detail" class="text-xs text-slate-400 font-mono truncate">

        <!-- Reset Counters Button -->

            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

      <!-- POSITION READOUT -->

    <!-- Sidebar Footer -->

  <!-- Main Viewport Area -->
  <main class="flex-1 h-full bg-[#090d16] relative flex items-center justify-center p-2 sm:p-6 md:p-8 overflow-hidden">
    <div class="w-full h-full max-w-6xl flex items-center justify-center relative">
      
      <svg id="court-svg" viewBox="0 0 1000 650" class="w-full h-full max-h-full cursor-crosshair drop-shadow-2xl select-none">

        <!-- 1. Deep Dark Blue Background Area (#090d16) -->

        <!-- 2. Green Court Mat Rectangle (#1b633a) - Red Outlined Zone -->

          <line x1="387.8" y1="100" x2="387.8" y2="550" />

          <line x1="163.1" y1="100" x2="163.1" y2="550" />

          <line x1="120" y1="325" x2="387.8" y2="325" />
          <line x1="612.2" y1="325" x2="880" y2="325" />
          <line x1="488" y1="325" x2="512" y2="325" stroke-width="3" opacity="0.8" />

        <!-- Center Net -->
        <g>
          <line x1="500" y1="85" x2="500" y2="565" stroke="#090d16" stroke-width="6" opacity="0.5" />
          <line x1="500" y1="85" x2="500" y2="565" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 3" />

          <circle cx="0" cy="0" r="18" id="ping-circle" fill="#10b981" opacity="0.3" class="animate-ping" />

      <div class="absolute top-3 right-3 bg-[#090d16]/90 text-white px-3 py-1.5 rounded-lg text-xs font-mono backdrop-blur border border-slate-800 shadow-xl pointer-events-none flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>X: <span id="overlay-x">740</span> | Y: <span id="overlay-y">210</span></span>
      </div>

    </div>
  </main>

  <script>
    /* Safe Analytics Event Tracker Wrapper */
    function trackEvent(eventName, eventData = {}) {
      try {
        if (typeof window !== 'undefined' && window?.umami?.track) {
          window.umami.track(eventName, eventData);
        }
      } catch (err) {
        console.debug('Analytics tracked silently:', eventName, err);
      }
    }

    /* Web Audio Sound Engine */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playHit(type = 'Smash') {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        const bufferSize = this.ctx.sampleRate * 0.08;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'highpass';

        if (type === 'Smash') {
          osc.frequency.setValueAtTime(420, t);
          osc.frequency.exponentialRampToValueAtTime(80, t + 0.06);
          gain.gain.setValueAtTime(0.8, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
          noiseFilter.frequency.setValueAtTime(1200, t);
        } else if (type === 'Clear') {
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(100, t + 0.08);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          noiseFilter.frequency.setValueAtTime(800, t);
        } else {
          osc.frequency.setValueAtTime(200, t);
          osc.frequency.exponentialRampToValueAtTime(120, t + 0.04);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          noiseFilter.frequency.setValueAtTime(400, t);
        }

        osc.connect(gain);
        whiteNoise.connect(noiseFilter);
        noiseFilter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(t);
        whiteNoise.start(t);
        osc.stop(t + 0.1);
        whiteNoise.stop(t + 0.1);
      }

      playWhistle() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(2400, t);
        osc.frequency.setValueAtTime(2600, t + 0.05);
        osc.frequency.setValueAtTime(2400, t + 0.1);

        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(t);
        osc.stop(t + 0.25);
      }
    }

    const audio = new AudioEngine();

    // Constants
    const CANVAS_WIDTH = 1000;
    const CANVAS_HEIGHT = 650;

    const MAT_X = 60, MAT_Y = 50, MAT_W = 880, MAT_H = 550;
    const COURT_X = 120, COURT_Y = 100, COURT_W = 760, COURT_H = 450;
    
    const METERS_PER_PX_Y = 6.10 / COURT_H;
    const SIDE_ALLEY_PX = (0.46 / 6.10) * COURT_H;

    // State Variables
    let dotPos = { x: 740, y: 210 };
    let mode = 'doubles';
    let shotType = 'Smash';
    let shotPower = 80;
    let isSimulating = false;
    let score = { in: 0, out: 0 };

    let pressedKeys = {};
    let stopTimeout = null;
    let animFrame = null;

    // DOM Elements
    const shuttleDot = document.getElementById('shuttle-dot');
    const dotShadow = document.getElementById('dot-shadow');
    const pingCircle = document.getElementById('ping-circle');
    const trajectoryPath = document.getElementById('trajectory-path');
    
    const posXEl = document.getElementById('pos-x');
    const posYEl = document.getElementById('pos-y');
    const overlayXEl = document.getElementById('overlay-x');
    const overlayYEl = document.getElementById('overlay-y');

    const countInEl = document.getElementById('count-in');
    const countOutEl = document.getElementById('count-out');
    const callBadge = document.getElementById('call-badge');
    const callText = document.getElementById('call-text');
    const callPing = document.getElementById('call-ping');
    const callDetail = document.getElementById('call-detail');
    const modeBadge = document.getElementById('mode-badge');
    const singlesAlleys = document.getElementById('singles-alleys');

    function getLineJudgeStatus(x, y, currentMode) {
      const isXInOuter = x >= COURT_X && x <= COURT_X + COURT_W;
      const isYInOuter = y >= COURT_Y && y <= COURT_Y + COURT_H;

      if (!isXInOuter || !isYInOuter) {
        let dx = 0;
        if (x < COURT_X) dx = COURT_X - x;
        else if (x > COURT_X + COURT_W) dx = x - (COURT_X + COURT_W);

        let dy = 0;
        if (y < COURT_Y) dy = COURT_Y - y;
        else if (y > COURT_Y + COURT_H) dy = y - (COURT_Y + COURT_H);

        const distFromBoundary = Math.sqrt(dx * dx + dy * dy);
        const outDistanceCm = (distFromBoundary * METERS_PER_PX_Y * 100).toFixed(1);
        return { status: 'OUT', code: 'OUT_OF_BOUNDS', line: `Outside Court Lines (${outDistanceCm} cm out)` };
      }

      const topSinglesLine = COURT_Y + SIDE_ALLEY_PX;
      const bottomSinglesLine = COURT_Y + COURT_H - SIDE_ALLEY_PX;

      if (currentMode === 'singles') {
        if (y < topSinglesLine || y > bottomSinglesLine) {
          const outDist = Math.min(Math.abs(y - topSinglesLine), Math.abs(y - bottomSinglesLine));
          const outDistCm = (outDist * METERS_PER_PX_Y * 100).toFixed(1);
          return { status: 'OUT', code: 'SIDE_OUT', line: `Outside Singles Line (${outDistCm} cm out)` };
        }
      }

      const distLeft = Math.abs(x - COURT_X);
      const distRight = Math.abs(x - (COURT_X + COURT_W));
      const minYBoundary = currentMode === 'singles' ? topSinglesLine : COURT_Y;
      const maxYBoundary = currentMode === 'singles' ? bottomSinglesLine : COURT_Y + COURT_H;
      
      const distTop = Math.abs(y - minYBoundary);
      const distBottom = Math.abs(y - maxYBoundary);

      const minDistancePx = Math.min(distLeft, distRight, distTop, distBottom);
      const minDistanceCm = (minDistancePx * METERS_PER_PX_Y * 100).toFixed(1);

      if (minDistancePx <= 4) {
        return { status: 'IN', code: 'LINE_CALL', line: `On Boundary Line (${minDistanceCm} cm)`, isLineCall: true };
      }

      return { status: 'IN', code: 'IN_BOUNDS', line: `Inside Court (${minDistanceCm} cm to line)` };
    }

    function updateDisplay() {
      // Position Update
      shuttleDot.setAttribute('transform', `translate(${dotPos.x}, ${dotPos.y})`);
      posXEl.textContent = Math.round(dotPos.x);
      posYEl.textContent = Math.round(dotPos.y);
      overlayXEl.textContent = Math.round(dotPos.x);
      overlayYEl.textContent = Math.round(dotPos.y);

      // Referee Judge Status
      const judge = getLineJudgeStatus(dotPos.x, dotPos.y, mode);
      
      callDetail.textContent = judge.line;

      if (judge.status === 'IN') {
        callText.textContent = judge.isLineCall ? 'LINE CALL' : 'IN';
        callBadge.className = judge.isLineCall
          ? 'px-4 py-1.5 rounded-lg text-lg font-black tracking-wider shadow-lg flex items-center gap-2 bg-amber-500/20 text-amber-300 border border-amber-500/50'
          : 'px-4 py-1.5 rounded-lg text-lg font-black tracking-wider shadow-lg flex items-center gap-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/50';
        callPing.className = 'w-2.5 h-2.5 rounded-full animate-ping bg-emerald-400';
        pingCircle.setAttribute('fill', '#10b981');
      } else {
        callText.textContent = 'OUT';
        callBadge.className = 'px-4 py-1.5 rounded-lg text-lg font-black tracking-wider shadow-lg flex items-center gap-2 bg-rose-500/20 text-rose-400 border border-rose-500/50';
        callPing.className = 'w-2.5 h-2.5 rounded-full animate-ping bg-rose-500';
        pingCircle.setAttribute('fill', '#f43f5e');
      }

      countInEl.textContent = score.in;
      countOutEl.textContent = score.out;
    }

    function recordLandingPoint(pos) {
      const judge = getLineJudgeStatus(pos.x, pos.y, mode);
      if (judge.status === 'IN') score.in++;
      else score.out++;
      updateDisplay();
    }

    function moveDot(dx, dy) {
      dotPos.x = Math.max(10, Math.min(CANVAS_WIDTH - 10, dotPos.x + dx));
      dotPos.y = Math.max(10, Math.min(CANVAS_HEIGHT - 10, dotPos.y + dy));
      updateDisplay();

      // Debounce movement stop detection
      if (stopTimeout) clearTimeout(stopTimeout);
      stopTimeout = setTimeout(() => {
        recordLandingPoint(dotPos);
        trackEvent('movement_stopped', { pos: dotPos, mode });
      }, 300);
    }

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
      const arrowKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
      if (arrowKeys.includes(e.key)) {
        e.preventDefault();
        pressedKeys[e.key] = true;

        let dx = 0, dy = 0;
        if (e.key === 'ArrowUp') dy = -5;
        if (e.key === 'ArrowDown') dy = 5;
        if (e.key === 'ArrowLeft') dx = -5;
        if (e.key === 'ArrowRight') dx = 5;

        moveDot(dx, dy);
        updateKeyHighlight();
        trackEvent('dot_moved_keyboard', { key: e.key });
      }
    });

    window.addEventListener('keyup', (e) => {
      const arrowKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
      if (arrowKeys.includes(e.key)) {
        pressedKeys[e.key] = false;
        updateKeyHighlight();
      }
    });

    function updateKeyHighlight() {
      const keyMap = {
        'ArrowUp': document.getElementById('key-up'),
        'ArrowLeft': document.getElementById('key-left'),
        'ArrowDown': document.getElementById('key-down'),
        'ArrowRight': document.getElementById('key-right'),
      };

      for (const [key, btn] of Object.entries(keyMap)) {
        if (pressedKeys[key]) {
          btn.className = 'w-10 h-10 rounded-lg flex items-center justify-center mb-1 border transition-all bg-emerald-500 text-white border-emerald-400 scale-95 shadow-lg shadow-emerald-500/30';
        } else {
          btn.className = 'w-10 h-10 rounded-lg flex items-center justify-center mb-1 border transition-all bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800';
        }
      }
    }

    // On-screen D-Pad Buttons
    document.getElementById('key-up').addEventListener('click', () => moveDot(0, -5));
    document.getElementById('key-down').addEventListener('click', () => moveDot(0, 5));
    document.getElementById('key-left').addEventListener('click', () => moveDot(-5, 0));
    document.getElementById('key-right').addEventListener('click', () => moveDot(5, 0));

    function triggerShotSimulation(targetX = null, targetY = null) {
      if (isSimulating) return;

      const startPos = { x: COURT_X + 80, y: CANVAS_HEIGHT / 2 };
      
      const minGreenX = MAT_X + 10, maxGreenX = MAT_X + MAT_W - 10;
      const minGreenY = MAT_Y + 10, maxGreenY = MAT_Y + MAT_H - 10;

      let destPos = { x: dotPos.x, y: dotPos.y };

      if (targetX !== null && targetY !== null) {
        destPos = {
          x: Math.max(minGreenX, Math.min(maxGreenX, targetX)),
          y: Math.max(minGreenY, Math.min(maxGreenY, targetY))
        };
      } else {
        const powerFactor = shotPower / 100;
        let baseLandingX = COURT_X + COURT_W * (0.55 + powerFactor * 0.48); 
        let baseLandingY = CANVAS_HEIGHT / 2 + (Math.random() - 0.5) * (COURT_H * 0.95 * powerFactor);

        if (shotType === 'Clear') baseLandingX = COURT_X + COURT_W * (0.68 + powerFactor * 0.42);
        else if (shotType === 'Smash') baseLandingX = COURT_X + COURT_W * (0.48 + powerFactor * 0.45);
        else if (shotType === 'Drop') baseLandingX = COURT_X + COURT_W * 0.53 + (Math.random() - 0.5) * 80;
        else if (shotType === 'Drive') baseLandingX = COURT_X + COURT_W * (0.6 + powerFactor * 0.38);
        else if (shotType === 'Net Shot') baseLandingX = COURT_X + COURT_W * 0.52 + (Math.random() - 0.5) * 40;

        destPos = {
          x: Math.max(minGreenX, Math.min(maxGreenX, baseLandingX)),
          y: Math.max(minGreenY, Math.min(maxGreenY, baseLandingY))
        };
      }

      isSimulating = true;
      document.getElementById('hit-shot-btn').disabled = true;
      document.getElementById('random-drop-btn').disabled = true;

      audio.playHit(shotType);

      let peakArc = 80;
      if (shotType === 'Clear') peakArc = 180;
      if (shotType === 'Drop') peakArc = 120;
      if (shotType === 'Smash') peakArc = 35;
      if (shotType === 'Drive') peakArc = 20;
      if (shotType === 'Net Shot') peakArc = 45;

      const startTime = performance.now();
      const duration = Math.max(400, 1200 - shotPower * 8);

      function animateFrame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);

        const curX = startPos.x + (destPos.x - startPos.x) * progress;
        const curY = startPos.y + (destPos.y - startPos.y) * progress;
        const currentHeight = Math.sin(progress * Math.PI) * peakArc;

        dotPos = { x: curX, y: curY };
        
        // Update flight height shadow
        dotShadow.setAttribute('rx', 9 + currentHeight * 0.1);
        dotShadow.setAttribute('ry', 5 + currentHeight * 0.05);
        dotShadow.setAttribute('cy', currentHeight * 0.4);

        // Trajectory Path curve
        const controlX = (COURT_X + 80 + dotPos.x) / 2;
        const controlY = (CANVAS_HEIGHT / 2 + dotPos.y) / 2 - currentHeight * 2;
        trajectoryPath.setAttribute('d', `M ${COURT_X + 80} ${CANVAS_HEIGHT / 2} Q ${controlX} ${controlY} ${curX} ${curY}`);

        updateDisplay();

        if (progress < 1) {
          animFrame = requestAnimationFrame(animateFrame);
        } else {
          isSimulating = false;
          document.getElementById('hit-shot-btn').disabled = false;
          document.getElementById('random-drop-btn').disabled = false;
          
          dotShadow.setAttribute('rx', 0);
          dotShadow.setAttribute('ry', 0);
          trajectoryPath.setAttribute('d', '');

          audio.playWhistle();
          recordLandingPoint(destPos);

          const judge = getLineJudgeStatus(destPos.x, destPos.y, mode);
          trackEvent('shot_simulated', { type: shotType, power: shotPower, result: judge.status });
        }
      }

      animFrame = requestAnimationFrame(animateFrame);
    }

    // Court Click Event Listener
    document.getElementById('court-svg').addEventListener('click', (e) => {
      if (isSimulating) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const scaleX = CANVAS_WIDTH / rect.width;
      const scaleY = CANVAS_HEIGHT / rect.height;

      const clickedX = (e.clientX - rect.left) * scaleX;
      const clickedY = (e.clientY - rect.top) * scaleY;

      triggerShotSimulation(clickedX, clickedY);
    });

    // Shot Selection Buttons
    document.querySelectorAll('#shot-type-selector button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#shot-type-selector button').forEach(b => {
          b.className = 'shot-btn py-1 px-2 text-[11px] font-medium rounded-md border transition-all bg-slate-900/80 text-slate-400 border-slate-800 hover:border-slate-700';
        });
        e.currentTarget.className = 'shot-btn py-1 px-2 text-[11px] font-medium rounded-md border transition-all bg-slate-800 text-emerald-400 border-emerald-500/50 shadow';
        shotType = e.currentTarget.dataset.type;
      });
    });

    // Power Slider
    document.getElementById('power-slider').addEventListener('input', (e) => {
      shotPower = Number(e.target.value);
      document.getElementById('power-value').textContent = `${shotPower}%`;
    });

    // Action Buttons
    document.getElementById('hit-shot-btn').addEventListener('click', () => triggerShotSimulation());
    
    document.getElementById('random-drop-btn').addEventListener('click', () => {
      const minGreenX = MAT_X + 15, maxGreenX = MAT_X + MAT_W - 15;
      const minGreenY = MAT_Y + 15, maxGreenY = MAT_Y + MAT_H - 15;

      const randX = minGreenX + Math.random() * (maxGreenX - minGreenX);
      const randY = minGreenY + Math.random() * (maxGreenY - minGreenY);
      triggerShotSimulation(randX, randY);
    });

    // Reset Buttons
    document.getElementById('reset-counts-btn').addEventListener('click', () => {
      score = { in: 0, out: 0 };
      updateDisplay();
      trackEvent('reset_stats');
    });

    document.getElementById('reset-pos-btn').addEventListener('click', () => {
      dotPos = { x: 740, y: 210 };
      updateDisplay();
      trackEvent('reset_position');
    });

    // Mode Buttons
    const modeDoublesBtn = document.getElementById('mode-doubles-btn');
    const modeSinglesBtn = document.getElementById('mode-singles-btn');

    modeDoublesBtn.addEventListener('click', () => {
      mode = 'doubles';
      modeBadge.textContent = 'DOUBLES';
      singlesAlleys.classList.add('hidden');
      modeDoublesBtn.className = 'py-1.5 text-xs font-medium rounded-lg transition-all bg-emerald-600 text-white shadow-md';
      modeSinglesBtn.className = 'py-1.5 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-slate-200';
      updateDisplay();
      trackEvent('mode_changed', { mode: 'doubles' });
    });

    modeSinglesBtn.addEventListener('click', () => {
      mode = 'singles';
      modeBadge.textContent = 'SINGLES';
      singlesAlleys.classList.remove('hidden');
      modeSinglesBtn.className = 'py-1.5 text-xs font-medium rounded-lg transition-all bg-emerald-600 text-white shadow-md';
      modeDoublesBtn.className = 'py-1.5 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-slate-200';
      updateDisplay();
      trackEvent('mode_changed', { mode: 'singles' });
    });

    // Audio Toggle Button
    const toggleSoundBtn = document.getElementById('toggle-sound-btn');
    const iconOn = document.getElementById('sound-icon-on');
    const iconOff = document.getElementById('sound-icon-off');

    toggleSoundBtn.addEventListener('click', () => {
      audio.enabled = !audio.enabled;
      if (audio.enabled) {
        iconOn.classList.remove('hidden');
        iconOff.classList.add('hidden');
      } else {
        iconOn.classList.add('hidden');
        iconOff.classList.remove('hidden');
      }
    });

    // Initial Display Render
    updateDisplay();
  </script>
</body>
</html>
